name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust 1.70
        uses: dtolnay/rust-toolchain@1.70
      - name: Check core (MSRV)
        run: cargo check --all-targets --locked
      - name: Check CLI (MSRV)
        run: cargo check --manifest-path cli/Cargo.toml
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Check
        run: cargo check --all-targets --locked

      - name: Test
        run: cargo test --all-targets --locked

      - name: Package
        run: cargo package --locked

      - name: Check CLI
        run: cargo check --manifest-path cli/Cargo.toml

      - name: Test CLI
        run: cargo test --manifest-path cli/Cargo.toml

      - name: Test lite build (no YARA)
        run: cargo test --no-default-features --locked

      - name: Test CLI lite build (no YARA)
        run: cargo test --manifest-path cli/Cargo.toml --no-default-features --locked
