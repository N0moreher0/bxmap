name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check
      - run: cargo fmt --check --manifest-path cli/Cargo.toml

  msrv:
    name: msrv (lite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.70
      - name: Check core (lite, MSRV)
        run: cargo check --locked --no-default-features
      - name: Check CLI (lite, MSRV)
        run: cargo check --locked --manifest-path cli/Cargo.toml --no-default-features

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --locked --all-targets
      - run: cargo clippy --locked --manifest-path cli/Cargo.toml --all-targets

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --all-targets
      - run: cargo test --locked --manifest-path cli/Cargo.toml
      - run: cargo test --locked --no-default-features --all-targets
      - run: cargo test --locked --manifest-path cli/Cargo.toml --no-default-features

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo package --locked -p bxmap
      - run: cargo package --locked -p bxmap-cli
PY