name: publish-crates

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Dry run (no actual publish)'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  publish:
    name: publish to crates.io
    runs-on: ubuntu-latest
    environment: crates.io
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish crate(s) to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -e
          echo "Token length: ${#CARGO_REGISTRY_TOKEN}"
          echo "Cargo config present: $(test -f /root/.cargo/credentials.toml && echo yes || echo no)"
          echo "Cargo home: $CARG (unset if unset)"
          cargo publish --locked -p bxmap ${{ github.event.inputs.dry-run == 'true' && '--dry-run' || '' }} 2>&1 || echo "(bxmap skipped: above)"
          if [ "${{ github.event.inputs.dry-run }}" != "true" ]; then sleep 45; fi
          cargo publish --locked -p bxmap-cli ${{ github.event.inputs.dry-run == 'true' && '--dry-run' || '' }}