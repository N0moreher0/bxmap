name: publish-crates

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Dry run (no actual publish)'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  publish:
    name: publish to crates.io
    runs-on: ubuntu-latest
    environment: crates.io
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish crate(s) to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set +e
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "ERROR: CARGO_REGISTRY_TOKEN is empty/unset."
            echo "Setup: GitHub repo Settings -> Secrets and variables -> Actions -> New repository secret 'CARGO_REGISTRY_TOKEN'"
            echo "Token source: https://crates.io/me -> Account Settings -> API Tokens -> scoped (publish-new, publish-update)"
            echo "Note: if the workflow targets an 'environment' (crates.io), check Settings -> Environments -> crates.io for environment-scoped secrets."
            exit 1
          fi
          set -e
          echo "Token length: ${#CARGO_REGISTRY_TOKEN}"
          cargo publish --locked -p bxmap ${{ github.event.inputs.dry-run == 'true' && '--dry-run' || '' }} 2>&1 || echo "(bxmap published/already on index)"
          if [ "${{ github.event.inputs.dry-run }}" != "true" ]; then sleep 30; fi
          cargo publish --locked -p bxmap-cli ${{ github.event.inputs.dry-run == 'true' && '--dry-run' || '' }}