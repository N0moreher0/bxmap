name: publish-crates

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Dry run (no actual publish)'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  publish:
    name: publish to crates.io
    runs-on: ubuntu-latest
    environment: crates.io
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish library (bxmap)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish --locked -p bxmap ${{ github.event.inputs.dry-run == 'true' && '--dry-run' || '' }}

      - name: Publish CLI (bxmap-cli)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish --locked -p bxmap-cli ${{ github.event.inputs.dry-run == 'true' && '--dry-run' || '' }}