[advisories]
# Các khóa `vulnerability` và `notice` đã bị cargo-deny bản mới gỡ bỏ
# (lỗ hổng luôn là lỗi mặc định) nên không khai báo nữa.
# Chỉ báo unmaintained cho dependency trực tiếp của workspace; các crate
# transitive (ví dụ bincode qua yara-x) không chặn CI.
unmaintained = "workspace"
ignore = [
  # RSA Marvin timing sidechannel (2023-0071). yara-x only uses this crate
  # for signature verification; bxmap never performs RSA private-key ops.
  "RUSTSEC-2023-0071",
]
yanked = "warn"

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "MPL-2.0",
  "AGPL-3.0-only",
  "Unicode-3.0",
  "CC0-1.0",
  "0BSD",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]