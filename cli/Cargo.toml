[package]
name = "bxmap-cli"
version = "1.0.15"
edition = "2021"
license = "AGPL-3.0-only"
description = "Command-line frontend for the bxmap memory-dump string extraction library"
readme = "README.md"
repository = "https://github.com/N0moreher0/bxmap"
keywords = ["strings", "forensics", "memory-dump", "malware", "dfir"]
categories = ["command-line-utilities"]
rust-version = "1.70"
# MSRV 1.70 chỉ áp dụng cho bản lite (`--no-default-features`). Bản đầy đủ
# (mặc định, kéo yara-x/wasmtime/cranelift) cần Rust ≥ 1.80.

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"

[features]
default = ["yara", "shift-jis"]
# Full build (YARA via yara-x, 64-bit only). Lite: --no-default-features
yara = ["bxmap/yara"]
shift-jis = ["bxmap/shift-jis"]

[dependencies]
bxmap = { version = "1.0.5", path = "..", default-features = false }
flate2 = "1"
memchr = "2"
rayon = "1"
regex = "1"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
criterion = "0.5"
