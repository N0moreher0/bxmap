[package]
name = "bxmap-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
bxmap = { path = ".." }
tempfile = "3"

